services:
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_SSL_VERIFY: ${REDIS_SSL_VERIFY:-false}
      JOB_RUNNER_MODE: ${JOB_RUNNER_MODE:-docker}
      JOB_QUEUE_NAME: ${JOB_QUEUE_NAME:-agent_jobs:queue}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_PATH: ${COOKIE_PATH:-/}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_ACCESS_NAME: ${COOKIE_ACCESS_NAME:-access_token}
      COOKIE_INSTALLATION_NAME: ${COOKIE_INSTALLATION_NAME:-installation_id}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-/run/secrets/github_app_private_key}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLOUD_KEY_JSON: ${GOOGLE_CLOUD_KEY_JSON:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_REGION: ${GCP_REGION:-}
      CLOUD_RUN_JOB: ${CLOUD_RUN_JOB:-}
    expose:
      - "8000"
    volumes:
      - ${GITHUB_PRIVATE_KEY_HOST_FILE:-./private-key.pem}:/run/secrets/github_app_private_key:ro

  job_runner:
    build:
      context: ./job_runner
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_SSL_VERIFY: ${REDIS_SSL_VERIFY:-false}
      JOB_QUEUE_NAME: ${JOB_QUEUE_NAME:-agent_jobs:queue}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    command: ["python", "worker.py"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_LOGIN_URL: ${VITE_LOGIN_URL:-}
        VITE_GITHUB_APP_INSTALL_URL: ${VITE_GITHUB_APP_INSTALL_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
