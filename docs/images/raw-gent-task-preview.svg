  <rect x="96" y="160" width="40" height="40" rx="12" fill="#172338"/>
  <rect x="96" y="222" width="40" height="40" rx="12" fill="#172338"/>
  <rect x="96" y="284" width="40" height="40" rx="12" fill="#172338"/>
  <rect x="96" y="346" width="40" height="40" rx="12" fill="url(#panelGlow)" opacity="0.75"/>
  <rect x="96" y="730" width="40" height="40" rx="12" fill="#172338"/>

  <rect x="168" y="54" width="1368" height="64" rx="34" fill="#0f1728"/>
  <text x="208" y="95" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Live task session</text>
  <text x="1224" y="95" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="18">job_4f2a8c19 · connected</text>

  <rect x="194" y="144" width="478" height="664" rx="28" fill="#16131f" stroke="#293548"/>
  <rect x="694" y="144" width="816" height="664" rx="28" fill="#14121b" stroke="#293548"/>

  <rect x="194" y="144" width="478" height="74" rx="28" fill="#1e1a27"/>
  <text x="228" y="188" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Task updates</text>
  <text x="228" y="210" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14">backend/routes/auth_routes.py · 2 files changed</text>
  <rect x="510" y="166" width="88" height="30" rx="15" fill="#0e7490" opacity="0.25"/>
