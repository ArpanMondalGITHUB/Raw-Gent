  <rect x="1110" y="320" width="370" height="436" rx="20" fill="#0f1420"/>
  <text x="754" y="352" fill="#94a3b8" font-family="Courier New, Courier, monospace" font-size="16">original</text>
  <text x="1138" y="352" fill="#94a3b8" font-family="Courier New, Courier, monospace" font-size="16">modified</text>

  <text x="754" y="392" fill="#64748b" font-family="Courier New, Courier, monospace" font-size="16">61  response = RedirectResponse(_frontend_home_url())</text>
  <text x="754" y="420" fill="#64748b" font-family="Courier New, Courier, monospace" font-size="16">62  response.set_cookie(...)</text>
  <text x="754" y="448" fill="#64748b" font-family="Courier New, Courier, monospace" font-size="16">63  return response</text>
  <text x="754" y="504" fill="#64748b" font-family="Courier New, Courier, monospace" font-size="16">78  ws.onerror = () =&gt; setisConnected(false)</text>
  <text x="754" y="532" fill="#64748b" font-family="Courier New, Courier, monospace" font-size="16">79  ws.close = () =&gt; {</text>
  <text x="754" y="560" fill="#64748b" font-family="Courier New, Courier, monospace" font-size="16">80    setisConnected(false)</text>
  <text x="754" y="588" fill="#64748b" font-family="Courier New, Courier, monospace" font-size="16">81  }</text>

  <rect x="1132" y="370" width="324" height="38" rx="10" fill="#052e2b"/>
