  <rect x="604" y="166" width="92" height="30" rx="15" fill="#14532d" opacity="0.35"/>
  <text x="624" y="186" fill="#dcfce7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Connected</text>

