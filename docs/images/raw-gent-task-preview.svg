<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Raw-Gent live task preview</title>
  <desc id="desc">A dark task workspace preview showing live agent messages on the left and a diff viewer on the right.</desc>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="60%" stop-color="#11131e"/>
      <stop offset="100%" stop-color="#1b1035"/>
    </linearGradient>
    <linearGradient id="panelGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#020617" flood-opacity="0.62"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <circle cx="1450" cy="160" r="150" fill="#22d3ee" opacity="0.10"/>
  <circle cx="1220" cy="720" r="200" fill="#a855f7" opacity="0.10"/>

  <rect x="64" y="54" width="1472" height="792" rx="34" fill="#090d17" stroke="#223048" filter="url(#shadow2)"/>

  <rect x="64" y="54" width="104" height="792" rx="34" fill="#0d1423"/>
