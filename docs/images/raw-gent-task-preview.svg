  <circle cx="288" cy="462" r="18" fill="#0284c7"/>
  <text x="282" y="468" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">A</text>
  <text x="318" y="454" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Agent</text>
  <text x="318" y="478" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="15">I found the cookie redirect chain and started the patch.</text>

