  <text x="252" y="274" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.2">LATEST MESSAGE</text>
  <text x="252" y="306" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Updated OAuth callback handling and queued the follow-up test pass.</text>

  <rect x="224" y="360" width="418" height="338" rx="22" fill="#0d1523"/>
  <text x="252" y="396" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Conversation</text>

